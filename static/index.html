<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HarkQuant Terminal</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/news/news.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand"><img src="/icons/favicon-32.png" alt="" width="20" height="20"><b>HARKQUANT</b><span class="muted hide-sm">Terminal</span></div>
    <div class="kpis" id="kpis"></div>
    <div class="top-right">
      <span class="stat-dots" id="topdots" title="Source status"></span>
      <span id="pill-conn" class="pill hide-sm">connecting</span>
      <span class="clock" id="clock">--:--:--<small>PKT</small></span>
    </div>
  </header>
  <div class="ticker" id="ticker" aria-label="Headlines and upcoming high-impact events">
    <div class="tk-tag">LIVE</div>
    <div class="tk-view" id="tk-view"><div class="tk-track" id="tk-track"></div></div>
    <div class="tk-ctl">
      <button id="tk-slow" title="Slower" aria-label="Slower">&minus;</button>
      <button id="tk-pause" title="Pause / play" aria-label="Pause">II</button>
      <button id="tk-fast" title="Faster" aria-label="Faster">+</button>
      <span class="spd" id="tk-spd"></span>
    </div>
  </div>
  <nav class="sidenav" id="nav" aria-label="Views"></nav>
  <main id="main" class="main" tabindex="-1"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/news/news.js"></script>
<script src="/assets/core.js"></script>
<script src="/assets/tv.js"></script>
<script src="/assets/ticker.js"></script>
<script src="/assets/views.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
